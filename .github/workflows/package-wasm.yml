
name: Package WASM
permissions:
  actions: read
  contents: read

on:
  workflow_run:
    workflows: ["Build Rust Libraries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      rust_run_id:
        description: "Run ID of Build Rust Libraries to pull artifacts from"
        required: false

jobs:
  package-wasm:
    name: Package WASM for web
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Debug artifact existence before download
        run: |
          echo "Checking for artifact 'wasm-out' in run ${{ github.event.workflow_run.id }}"
          # There is no direct way to list artifacts, but this step will help debug
          echo "If download fails, check that the build workflow completed and uploaded the artifact."

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-out
          path: wasm-out/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy assets and index.html into package
        run: |
          mkdir -p wasm-package
          cp -r wasm-out/* wasm-package/
          cp -r assets wasm-package/assets
          # Copy your web shell index.html if you have one
          if [ -f web/index.html ]; then
            cp web/index.html wasm-package/index.html
          fi

      - name: Upload WASM package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: wasm-package/
          retention-days: 14

      # Optional: deploy to GitHub Pages on main branch
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event.workflow_run.head_branch == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wasm-package/
