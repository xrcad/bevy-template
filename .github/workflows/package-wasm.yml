name: Package WASM
permissions:
  actions: read
  contents: read

on:
  workflow_run:
    workflows: ["Build Rust Libraries"]
    types: [completed]

jobs:
  package-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-out
          path: wasm-out/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Package WASM
        run: |
          mkdir -p wasm-package
          cp -r wasm-out/* wasm-package/
          if [ -d assets ]; then cp -r assets wasm-package/assets; fi
      - name: Upload WASM package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: wasm-package/
          retention-days: 14
