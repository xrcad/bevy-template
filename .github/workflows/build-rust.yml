name: Build Rust Libraries
permissions:
  actions: read
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pin NDK version - change here only, propagates everywhere
  NDK_VERSION: "27.3.13750724"
  # Minimum Android API - GameActivity requires 31+
  MIN_SDK: "31"

jobs:
  # ── Android .so ────────────────────────────────────────────────────────────
  android-lib:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK & NDK
        uses: ./.github/actions/setup-android-sdk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android .so
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --platform ${{ env.MIN_SDK }} \
            -o android-project/app/src/main/jniLibs \
            build --package myapp

      - name: Upload jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: android-project/app/src/main/jniLibs/
          retention-days: 7

  # ── WASM ───────────────────────────────────────────────────────────────────
  wasm-lib:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked

      - name: Build WASM
        run: |
          cargo build --release --target wasm32-unknown-unknown --package myapp
          wasm-bindgen \
            --out-dir wasm-out \
            --target web \
            target/wasm32-unknown-unknown/release/myapp.wasm

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: wasm-out
          path: wasm-out/
          retention-days: 7
