name: Assemble Android APK
permissions:
  actions: read
  contents: read

on:
  workflow_run:
    workflows: ["Build Rust Libraries"]
    types: [completed]

jobs:
  assemble-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: ./.github/actions/setup-android-sdk
        with:
          ndk-version: 27.3.13750724
      - name: Download jniLibs artifact
        uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: android-project/app/src/main/jniLibs/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Gradle wrapper
        working-directory: android-project
        run: gradle wrapper
      - name: Assemble debug APK
        working-directory: android-project
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          retention-days: 14
