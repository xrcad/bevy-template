name: 'Setup Android SDK'
description: 'Installs Android SDK Command-line Tools and sets up sdkmanager in PATH.'
inputs:
  ndk-version:
    description: 'NDK version to install (e.g. 27.3.13750724)'
    required: false
    default: '27.3.13750724'
runs:
  using: 'composite'
  steps:
    - name: Install Android SDK Command-line Tools
      shell: bash
      run: |
        mkdir -p "$HOME/android-sdk/cmdline-tools"
        cd "$HOME/android-sdk/cmdline-tools"
        curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools latest
        rm cmdline-tools.zip
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

    - name: Add Android SDK tools to PATH
      shell: bash
      run: |
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

    - name: Accept Android SDK licenses
      shell: bash
      run: |
        yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses

    - name: Install Android NDK
      shell: bash
      run: |
        NDK_VERSION="${{ inputs.ndk-version }}"
        echo "Attempting to install NDK version $NDK_VERSION..."
        "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "ndk;$NDK_VERSION" || {
          echo "NDK install failed. Listing SDK root contents:";
          ls -l "$HOME/android-sdk";
          echo "Listing NDK directory:";
          ls -l "$HOME/android-sdk/ndk" || true;
          exit 1;
        }
        echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/$NDK_VERSION" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$HOME/android-sdk/ndk/$NDK_VERSION" >> $GITHUB_ENV
