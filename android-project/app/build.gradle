dependencies {
    // GameActivity from the Android Game Development Kit (AGDK).
    // This is what Bevy's `android-game-activity` feature targets.
    implementation "androidx.games:games-activity:3.0.5"

    // AppCompat is required because GameActivity extends AppCompatActivity,
    // and the manifest theme must derive from Theme.AppCompat.
    implementation "androidx.appcompat:appcompat:1.7.0"
}

